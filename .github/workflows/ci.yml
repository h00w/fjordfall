name: Build and game flow
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify independent Cloudflare hosting build
        run: |
          pnpm configure:cloudflare 11111111-1111-4111-8111-111111111111
          pnpm exec wrangler d1 migrations apply fjordfall-db --local --config wrangler.cloudflare.json
          WORKERS_CI=1 pnpm exec vinext build
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const c = JSON.parse(fs.readFileSync("dist/server/wrangler.json")); assert.equal(c.name, "fjordfall"); assert.equal(c.d1_databases[0].database_id, "11111111-1111-4111-8111-111111111111"); assert.equal(c.d1_databases[0].database_name, "fjordfall-db");'
          pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json
